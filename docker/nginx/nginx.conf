events {}

http {
  upstream creditsim_api {
    server api:8000;
  }

  server {
    listen 80;

    location /edge-health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # /api/health  ->  api:8000/health
    location /api/ {
      proxy_pass http://creditsim_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets (Swagger UI theme)
    location /static/ {
      proxy_pass http://creditsim_api/static/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 200 "creditsim edge is running\n";
      add_header Content-Type text/plain;
    }
  }
}
