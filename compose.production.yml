services:
  nginx:
    image: ${REGISTRY}/${IMAGE_OWNER}/creditsim-challenge-front:${SERVICE_TAG}
    container_name: creditsim-nginx
    restart: unless-stopped
    environment:
      - API_PORT=${API_PORT:-8105}
    ports:
      - "88:80"
      - "8443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - creditsim-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost/edge-health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    image: ${REGISTRY}/${IMAGE_OWNER}/creditsim-challenge-api:${SERVICE_TAG}
    container_name: creditsim-api
    restart: unless-stopped
    expose:
      - "${API_PORT:-8105}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - creditsim-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${API_PORT:-8105}/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: creditsim-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - creditsim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: creditsim-redis
    restart: unless-stopped
    networks:
      - creditsim-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ${REGISTRY}/${IMAGE_OWNER}/creditsim-challenge-api:${SERVICE_TAG}
    container_name: creditsim-migrate
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - creditsim-network
    command: ["alembic", "upgrade", "head"]
    restart: on-failure

  worker:
    image: ${REGISTRY}/${IMAGE_OWNER}/creditsim-challenge-api:${SERVICE_TAG}
    container_name: creditsim-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - creditsim-network
    command:
      [
        "celery",
        "-A",
        "app.infrastructure.celery_app",
        "worker",
        "--loglevel=info",
      ]

volumes:
  postgres_data:

networks:
  creditsim-network:
    driver: bridge
