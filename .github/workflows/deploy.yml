name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service_tag:
        description: 'Tag específico a desplegar (opcional, usa latest si vacío)'
        required: false
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # Job 0: Run Tests
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests with docker-compose
        run: |
          cp .env.example .env
          make test-compose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: creditsim-api/test-results/
          retention-days: 30

  # ============================================================================
  # Job 1: Setup - Convertir nombres a minúsculas
  # ============================================================================
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      image_api: ${{ steps.lowercase.outputs.image_api }}
      image_front: ${{ steps.lowercase.outputs.image_front }}
    steps:
      - name: Convert to lowercase
        id: lowercase
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image_api=${{ env.REGISTRY }}/${REPO_LOWER}-api" >> $GITHUB_OUTPUT
          echo "image_front=${{ env.REGISTRY }}/${REPO_LOWER}-front" >> $GITHUB_OUTPUT

  # ============================================================================
  # Job 2: Build y Push de imágenes Docker
  # ============================================================================
  build:
    name: Build Docker Images
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      service_tag: ${{ steps.meta.outputs.service_tag }}
      git_sha: ${{ steps.meta.outputs.git_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          GIT_SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          SERVICE_TAG="${{ github.event.inputs.service_tag }}"
          if [ -z "$SERVICE_TAG" ]; then
            SERVICE_TAG="${BRANCH_NAME}-${GIT_SHA_SHORT}-${TIMESTAMP}"
          fi
          
          echo "service_tag=${SERVICE_TAG}" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "::notice::Building with tag: ${SERVICE_TAG}"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./creditsim-api
          file: ./creditsim-api/Dockerfile
          push: true
          tags: |
            ${{ needs.setup.outputs.image_api }}:${{ steps.meta.outputs.service_tag }}
            ${{ needs.setup.outputs.image_api }}:latest
          cache-from: |
            type=registry,ref=${{ needs.setup.outputs.image_api }}:latest
            type=registry,ref=${{ needs.setup.outputs.image_api }}:buildcache
          cache-to: type=registry,ref=${{ needs.setup.outputs.image_api }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./creditsim-front
          file: ./creditsim-front/Dockerfile
          target: runner
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ${{ needs.setup.outputs.image_front }}:${{ steps.meta.outputs.service_tag }}
            ${{ needs.setup.outputs.image_front }}:latest
          cache-from: |
            type=registry,ref=${{ needs.setup.outputs.image_front }}:latest
            type=registry,ref=${{ needs.setup.outputs.image_front }}:buildcache
          cache-to: type=registry,ref=${{ needs.setup.outputs.image_front }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ============================================================================
  # Job 3: Deploy al servidor usando Doppler para secrets
  # ============================================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment:
      name: production
      url: https://creditsim.iayala.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Trim whitespace from SSH_HOST
          SSH_HOST=$(echo "${{ secrets.SSH_HOST }}" | tr -d '[:space:]')
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Export environment variables from Doppler
        run: |
          doppler secrets download --no-file --format env > /tmp/creditsim.env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}

      - name: Add deployment metadata to env
        run: |
          cat >> /tmp/creditsim.env << EOF
          # Deployment metadata
          SERVICE_TAG=${{ needs.build.outputs.service_tag }}
          GIT_SHA=${{ needs.build.outputs.git_sha }}
          DEPLOYED_BY=${{ github.actor }}
          DEPLOYED_AT=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Variables para docker-compose
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          EOF

      - name: Deploy to server (pull-based approach)
        run: |
          SSH_KEY=~/.ssh/deploy_key
          SSH_USER=$(echo "${{ secrets.SSH_USER }}" | tr -d '[:space:]')
          SSH_HOST=$(echo "${{ secrets.SSH_HOST }}" | tr -d '[:space:]')

          # Copy compose and env files
          ssh -i "$SSH_KEY" ${SSH_USER}@${SSH_HOST} "mkdir -p ~/creditsim"
          scp -i "$SSH_KEY" compose.production.yml ${SSH_USER}@${SSH_HOST}:~/creditsim/docker-compose.yml
          scp -i "$SSH_KEY" /tmp/creditsim.env ${SSH_USER}@${SSH_HOST}:~/creditsim/.env

          # Server pulls images and deploys (more secure, no image transfer needed)
          ssh -i "$SSH_KEY" ${SSH_USER}@${SSH_HOST} <<ENDSSH
          set -e
          cd ~/creditsim

          # Login to GHCR from server (read-only access)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "→ Pulling images from registry..."
          docker compose pull

          echo "→ Stopping old containers..."
          docker compose down || true

          echo "→ Starting updated containers..."
          docker compose up -d

          echo "→ Service status:"
          docker compose ps
          ENDSSH

      - name: Health check
        run: |
          SSH_KEY=~/.ssh/deploy_key
          SSH_USER=$(echo "${{ secrets.SSH_USER }}" | tr -d '[:space:]')
          SSH_HOST=$(echo "${{ secrets.SSH_HOST }}" | tr -d '[:space:]')
          
          echo "→ Verifying deployment..."
          ssh -i "$SSH_KEY" ${SSH_USER}@${SSH_HOST} << 'ENDSSH'
          cd ~/creditsim
          
          echo "Waiting 20 seconds for services to stabilize..."
          sleep 20
          
          echo ""
          echo "Container status:"
          docker compose ps
          
          echo ""
          echo "Testing API health endpoint (from server)..."
          # Ensure jq is available
          if ! command -v jq &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          
          if curl -f -s http://localhost:88/api/health | jq '.'; then
            echo "✓ Deployment successful!"
            exit 0
          else
            echo "✗ Health check failed"
            echo "API logs:"
            docker compose logs api --tail=50
            exit 1
          fi
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f /tmp/creditsim.env

      - name: Deployment summary
        run: |
          cat << EOF
          ╔════════════════════════════════════════════╗
          ║       ✓ Deployment Successful! 🚀         ║
          ╚════════════════════════════════════════════╝
          
          📦 Service Tag: ${{ needs.build.outputs.service_tag }}
          🔖 Git SHA: ${{ needs.build.outputs.git_sha }}
          👤 Deployed by: ${{ github.actor }}
          🌐 URL: https://${{ secrets.SERVICE_DOMAIN }}
          📊 API Health: http://${{ secrets.SSH_HOST }}:88/api/health
          
          EOF
